[build]
  publish = "."
  functions = "netlify/functions"

# Lets the frontend keep calling /api/create-order etc. — Netlify
# transparently routes these to the serverless functions below.
[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200
